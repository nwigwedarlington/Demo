apiVersion: apps/v1
kind: Deployment
metadata:
  name: factcheck-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: factcheck-worker
  template:
    metadata:
      labels:
        app: factcheck-worker
    spec:
      containers:
        - name: worker
          image: factcheck-api:latest
          command: ["dramatiq", "app.workers.tasks"]
          envFrom:
            - secretRef:
                name: factcheck-secrets
